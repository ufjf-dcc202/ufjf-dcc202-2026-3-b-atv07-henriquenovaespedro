<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC202 CSS Embutido</title>
    <style>
        em {
            color: orange
        }
        code {
            color: lime;
            text-decoration-line: underline;
            font-family: sans-serif;
        }
        dt > code {
            color: white;
            background-color: black;
        }
         
    </style>
</head>
<body>
    <h1>DCC202 CSS Embutido</h1>
    <p>Vocẽ pode aplicar um estilo <em>
        para um elemento </em> usando o atributo <code>embutido para um elemento </code>style.

    </p>
    <dl>
        <div>
            <dt><code>color</code></dt>
            <dd>Cor texto do elemento.</dd>
        </div>
        <div>
            <dt><code>background-color</code></dt>
        </div>
    </dl>
</body>
</html>
